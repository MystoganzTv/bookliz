name: CI

# Runs on every push and every pull request to main. Before this existed the
# only workflow in the repo deployed docs/ to GitHub Pages, so nothing ever
# type-checked or tested anything: four ownership bugs of the same shape
# shipped to a phone before anyone noticed.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci needs package-lock.json to match package.json exactly; it fails
      # loudly if they have drifted, which is the point.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # --ci makes a missing snapshot a failure instead of writing a new one.
      - name: Tests
        run: npm test -- --ci --silent
